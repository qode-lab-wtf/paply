<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recording</title>
  <style>
    /* Transparentes Fenster: überstimmt body bg-background aus globals.css */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
    }
  </style>
  <script>
    // Rückfall-Modus ohne Fenster-Transparenz (setzt electron-main.js per ?opaque=1)
    if (new URLSearchParams(location.search).has('opaque')) document.documentElement.classList.add('opaque');
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./apps/recording/main.tsx"></script>
</body>
</html>
