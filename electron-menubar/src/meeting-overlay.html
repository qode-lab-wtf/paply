<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting</title>
  <style>
    /* WICHTIG: globals.css setzt body{bg-background} (undurchsichtig) und wird NACH
       diesem Block geladen -> ohne !important wäre das Overlay ein weißer Kasten.
       Transparent erzwingen, damit nur Pill + Karte sichtbar sind (floating). */
    html, body, #root {
      margin: 0;
      padding: 0;
      background: transparent !important;
      background-color: transparent !important;
    }
    body { -webkit-app-region: drag; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./apps/meeting-overlay/main.tsx"></script>
</body>
</html>
