name: Regeln prüfen

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  regeln:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Alle Apps gegen REGELN.md prüfen
        run: node shared/regeln-pruefen.mjs
