   <h4>Deine Zuordnungen (lernt daraus)</h4>${corr.map(c => `<div class="li">„${esc(S.notes[c.thought]?.title)}“ → <b>${c.to ? esc(S.areas[c.to]?.title) : 'ohne Thema'}</b><br><span class="fine">Merkmale: ${c.terms.slice(0, 6).map(esc).join(', ')} · Beispiel im Kontext, wenn Neues ähnlich klingt</span></div>`).join('') || '<div class="li fine">Noch keine. Ziehst du eine Karte in einen anderen Bereich, merkt sich Paply das als Beispiel – kein Profil, kein Training.</div>'}
   <h4>Vorgeschlagene Bezüge</h4><div class="li">${rels.filter(r => !r.deleted && r.state !== 'kept').length} offen · ${rels.filter(r => r.state === 'kept' && !r.deleted).length} behalten · ${rels.filter(r => r.deleted).length} entfernt (kommen nicht wieder)<br><span class="fine">Offene Vorschläge laufen nach 30 Tagen ohne Reaktion aus.</span></div>
   <h4>Bilder</h4>${imgs.map(id => `<div class="li"><b>${esc(id === 'demo-shot' ? 'Bildschirm 16:20' : 'Eingefügtes Bild')}</b> · Text lokal erkennen (Simulation) · Cloud-Beschreibung: aus<br><span class="fine">einmal je Inhalt (Hash) und Analyseversion, nie bei jedem Öffnen</span></div>`).join('') || '<div class="li fine">Keine.</div>'}
   <h4>Kontingent heute (Simulation, Anteil für Notes)</h4>${bar('whisper-large-v3-turbo', 'Sprache')}${bar('openai/gpt-oss-20b', 'Einordnung')}${bar('openai/gpt-oss-120b', 'Zweiter Versuch')}${bar('qwen/qwen3.8-27b', 'Bildbeschreibung')}
   <h4>Aufräumen</h4><div class="li">${S.janitor ? `Zuletzt ${S.janitor.at}: ${S.janitor.corr} Korrekturen ohne Quelle, ${S.janitor.areas} leere KI-Bereiche, ${S.janitor.rels} Bezüge zu Gelöschtem entfernt` : 'Noch nicht gelaufen'}</div>
   <div class="btns"><button class="btn" data-mem="janitor">${ico('RotateCcw', 14)} Jetzt aufräumen</button></div>`;
}
$('#mem').addEventListener('click', e => { const a = e.target.closest('[data-mem]')?.dataset.mem; if (a === 'close') { $('#mem').hidden = true; renderDemo(); } if (a === 'janitor') { const r = janitor(); toast(`Aufgeräumt: ${r.corr + r.areas + r.rels} abgeleitete Einträge entfernt, keine Notiz angetastet`); renderMemory(); } });

// ---------- Szenarien ----------
function seedUser() { const a = 'a_e4_k1'; if (!S.areas[a]) return; const id = 'n_seed1';
  commit([{ c: 'notes', id, v: { id, kind: 'sticky', title: '', titleBy: 'user', passages: [{ id: 'p_seed1', text: 'Tisch: 180 × 90 cm, Eiche.\nLeuchte etwa 70 cm über der Platte.', by: 'user', at: '20:14', day: 'Di', ord: ++S.seq }], attachments: [], created: '20:14', day: 'Di', order: ++S.seq } },
    { c: 'members', id, v: { area: a, by: 'user' } }, { c: 'pos', id, v: { x: K.PAD + 2 * (K.W + K.GAP) + 6, y: K.HEAD, pinned: true, local: true } },
    { c: 'rels', id: 'r_seed1', v: { id: 'r_seed1', from: id, to: 't_e2_0', kind: 'arrow', by: 'user', state: 'kept' } }], { actor: 'system' }); }
async function setScenario(name) {
  SIM.token++; SIM.busy = false; SIM.recording = null; clearInterval(recTimer); $('#rec').hidden = true; $('#mic').setAttribute('aria-pressed', 'false');
  S = fresh(); undoStack = []; redoStack = []; tour = null; sel = null; editing = null; $('#tour').hidden = true; closePop(); closeMenu();
  for (const el of els.cards.values()) el.remove(); els.cards.clear(); for (const el of els.areas.values()) el.remove(); els.areas.clear(); labelSig = '';
  SIM.scenario = name; SIM.cursor = 0; SIM.script = name === 'full' ? [] : [...SCRIPT_DAY]; SIM.online = true; SIM.failNext = null; SIM.budgetEmpty = false; SIM.ledger = {}; camTouched = false; $('#mem').hidden = true; app.classList.add('instant');
  if (name === 'evening' || name === 'full') { for (const it of (name === 'full' ? [...SCRIPT_DAY, ...SCRIPT_NEXT] : SCRIPT_DAY)) { const e = createEntry(it, name === 'full' && SCRIPT_DAY.includes(it) ? { day: 'Mo' } : {}); await drive(e, true); } SIM.cursor = SIM.script.length; for (const e of Object.values(S.entries)) e.doneAt = 1; }
  if (name === 'full') { seedUser(); S.unseen = S.unseen.filter(u => S.entries[u.entry]?.day === 'Heute'); }
  setTool('select'); refresh(); renderInbox(); renderDemo();
  if (name === 'empty') { const ins = insets(); cam = { x: ins.l + 40, y: ins.t + 40, z: 1 }; requestCam(); } else fitAll(true);
  requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove('instant')));
}

window.paplyNotesDemo = {
  version: 'opus-1-reviewed',
  budgetCap: (model, cap) => { if (!(model in LEDGER_CAP) || !Number.isFinite(cap) || cap < 0) throw new Error('Ungültiges Testbudget'); LEDGER_CAP[model] = cap; wakeBudget(); },
  state: () => ({ scenario: SIM.scenario, notes: liveNotes().map(n => ({ id: n.id, kind: n.kind, title: n.title, titleBy: n.titleBy, area: areaOf(n.id), passages: n.passages.length, attachments: (n.attachments || []).length, pinned: !!S.pos[n.id]?.pinned, fallback: !!n.fallback, rect: R.notes[n.id] })),
    areas: liveAreas().map(a => ({ id: a.id, title: a.title, by: a.by, members: membersOf(a.id).map(n => n.id), rect: R.areas[a.id] })), rels: liveRels().map(r => ({ id: r.id, from: r.from, to: r.to, by: r.by, state: r.state, kind: r.kind })),
    entries: S.order.map(id => { const e = S.entries[id]; return { id, state: e.state, model: e.model, keepShot: !!e.keepShot, log: e.log }; }), unseen: unseenCount(), camera: { ...cam }, lod, tool, selection: sel, editing: editing?.id || null, undo: undoStack.length, redo: redoStack.length, online: SIM.online }),
  scenario: setScenario, next: () => { const e = simNext(); return idleAll().then(() => e?.id); }, restClosed: simRestClosed, idle: idleAll,
  budgetEmpty: on => { if (!!on !== SIM.budgetEmpty) $('#demo [data-d=budget]').click(); }, memory: () => ({ corr: Object.values(S.corr).filter(c => !c.deleted), topics: liveAreas().map(a => ({ id: a.id, title: a.title, aliases: a.aliases || [], status: topicStatus(a) })), ledger: SIM.ledger, janitor: S.janitor }), janitor, setOnline, failNext: kind => { SIM.failNext = kind; renderDemo(); }, screenContext: on => { SIM.screenContext = !!on; renderDemo(); },
  goArea, fitAll: () => fitAll(), setTool, select: (t, id) => select(id ? { t, id } : null), edit: startEdit, commitEdit, undo, redo, deleteSelection: deleteSel,
  tour: { start: startTour, next: () => { if (tour && tour.i < tour.items.length - 1) { tour.i++; showTourStep(); } }, end: endTour, revert: () => $('#tour [data-tour=revert]')?.click(), current: () => tour ? { i: tour.i, n: tour.items.length, text: explainNow(tour.items[tour.i]) } : null },
  pasteDemoImage: demoPaste, pasteText: t => { const dt = new DataTransfer(); dt.setData('text/plain', t); stage.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true })); },
  screenCommand: text => !!screenCommand([{ id: 's1', text }]), validate: (obj, entryId) => validate(obj, S.entries[entryId]),
  setCamera: c => { flight = null; cam = { ...cam, ...c }; requestCam(); }, worldToScreen: (x, y) => toScreen(x, y), record: { start: startRec, shot: () => $('#rec-shot')?.click(), stop: stopRec },
};

renderDemo(); setScenario('evening').then(() => goArea('a_e3_k1', true));
})();
