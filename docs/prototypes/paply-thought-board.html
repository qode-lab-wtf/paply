function goArea(id,smooth=true){commitReader();closeReader(false);select(null);const f=data.frames.find(f=>f.id===id);$('#current-area').textContent=f?f.title:'Alle Gedanken';focusRect(f||bounds(),smooth);$('#area-menu').hidden=true;$('#area-trigger').setAttribute('aria-expanded','false');}
function zoomBy(factor,cx=stage.clientWidth/2,cy=stage.clientHeight/2){const prev=target,z=Math.max(.22,Math.min(2,prev.z*factor));moveCamera({z,x:cx-(cx-prev.x)*z/prev.z,y:cy-(cy-prev.y)*z/prev.z});}
function openReader(mode='read'){const item=find();if(!item)return;readerMode=mode;$('#reader').hidden=false;$('#context').hidden=true;const edge=selection.type==='edge',frame=selection.type==='frame';$('#reader-label').textContent=edge?(item.origin==='ai'?'Möglicher Zusammenhang':'Deine Verbindung'):frame?'Bereich':'Dein Gedanke';$('#reader-copy').hidden=edge;$('#reader-edit').hidden=edge||mode==='edit';$('#reader-save').hidden=edge||mode!=='edit';
 if(edge){$('#reader-content').innerHTML='<p class="reader-text">'+esc(item.reason||'Diese Verbindung hast du selbst angelegt.')+'</p><p class="origin">'+(item.origin==='ai'?'Von der KI vorgeschlagen. Du kannst die Verbindung über den Papierkorb entfernen.':'Von dir angelegt.')+'</p>';}
 else if(mode==='edit'){$('#reader-content').innerHTML='<input id="title-input" aria-label="Titel" value="'+esc(item.title||'')+'">'+(frame?'':'<textarea id="text-input" aria-label="Notiztext">'+esc(item.text)+'</textarea>');}
 else{$('#reader-content').innerHTML='<h2 class="reader-title">'+esc(item.title||'Notiz')+'</h2><div class="reader-text">'+esc(frame?data.notes.filter(n=>n.frame===item.id).map(n=>n.title+'\n'+n.text).join('\n\n'):item.text)+'</div>';}
 const width=Math.min(360,stage.clientWidth-28),r=selectedRect(),rx=camera.x+(r.x+r.w)*camera.z+12;$('#reader').style.left=Math.max(14,Math.min(stage.clientWidth-width-14,rx))+'px';$('#reader').style.top=Math.max(16,Math.min(80,stage.clientHeight-460))+'px';if(mode==='edit')requestAnimationFrame(()=>$('#text-input')?.focus({preventScroll:true}));}
function commitReader(){if(readerMode!=='edit')return;const item=find();if(!item)return;const title=$('#title-input')?.value.trim()||'Notiz',text=$('#text-input')?.value??item.text;if(title!==item.title||text!==item.text){remember();item.title=title;if(selection.type==='note'){item.text=text;item.edited=true;data.edges=data.edges.filter(e=>!(e.origin==='ai'&&(e.from===item.id||e.to===item.id)));}render();}}
function closeReader(save=true){if(save)commitReader();readerMode=null;$('#reader').hidden=true;overlays();}
function deleteSelected(){if(!selection)return;closeReader();const selected=selection;remember();if(selected.type==='note'){data.notes=data.notes.filter(n=>n.id!==selected.id);data.edges=data.edges.filter(e=>e.from!==selected.id&&e.to!==selected.id);}else if(selected.type==='frame'){data.frames=data.frames.filter(n=>n.id!==selected.id);data.notes.forEach(n=>{if(n.frame===selected.id)n.frame=null;});}else data.edges=data.edges.filter(e=>e.id!==selected.id);selection=null;render();toast('Entfernt · ⌘Z macht es rückgängig');}
async function copySelected(){const item=find();if(!item)return;const text=readerMode==='edit'?($('#text-input')?.value||$('#title-input').value):selection.type==='frame'?data.notes.filter(n=>n.frame===item.id).map(n=>n.title+'\n'+n.text).join('\n\n'):item.text;try{await navigator.clipboard.writeText(text||item.title);toast('Kopiert');}catch{openReader('edit');const field=$('#text-input')||$('#title-input');field.focus();field.select();toast('Text ausgewählt · mit ⌘C / Strg+C kopieren');}}
function addNote(point,kind){remember();const frame=data.frames.find(f=>point.x>=f.x&&point.x<=f.x+f.w&&point.y>=f.y&&point.y<=f.y+f.h),id='n'+(++seq);data.notes.push({id,frame:frame?.id||null,kind:kind==='text'?'text':'sticky',x:point.x-140,y:point.y-80,w:280,h:kind==='text'?150:225,title:kind==='text'?'Text':'Neue Notiz',text:'',time:'Gerade eben',pinned:true});setTool('select');selection={type:'note',id};render();openReader('edit');}
function addEdge(start,end){if(start.id&&start.id===end.id)return;remember();data.edges.push({id:'e'+(++seq),from:start.id,to:end.id,a:start.point,b:end.point,kind:tool,origin:'user'});setTool('select');render();toast('Verbindung angelegt');}
function eventObject(target){const node=target.closest('[data-node]'),frame=target.closest('[data-frame]'),edge=target.closest('[data-edge]');return node?{type:'note',id:node.dataset.node}:frame?{type:'frame',id:frame.dataset.frame}:edge?{type:'edge',id:edge.dataset.edge}:null;}
function drawGhost(start,end){$('#ghost-line').hidden=false;$('#ghost-line').setAttribute('d','M'+start.x+','+start.y+' L'+end.x+','+end.y);$('#ghost-line').setAttribute('marker-end',tool==='arrow'?'url(#arrowhead)':'');}
stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('[data-ui]')||e.button>1)return;active=true;stage.focus({preventScroll:true});$('#area-menu').hidden=true;commitReader();closeReader(false);stopCamera();const point=screenToWorld(e),hit=eventObject(e.target),hand=space||tool==='hand'||e.button===1;
 if(!hand&&(tool==='note'||tool==='text')){addNote(point,tool);return;}
 if(!hand&&(tool==='line'||tool==='arrow')){const start={point,id:hit?.type==='note'?hit.id:null};if(pending){addEdge(pending,start);pending=null;return;}gesture={kind:'edge',start,mx:e.clientX,my:e.clientY};}
 else if(!hand&&tool==='frame'){gesture={kind:'frame',start:point,mx:e.clientX,my:e.clientY};}
 else if(hand||!hit){select(null);gesture={kind:'pan',mx:e.clientX,my:e.clientY,camera:{...camera}};}
 else{select(hit);gesture={kind:hit.type==='edge'?'click':'move',sel:hit,start:point,mx:e.clientX,my:e.clientY,before:snapshot(),moved:false};}
 stage.setPointerCapture(e.pointerId);gesture.pointer=e.pointerId;stage.dataset.dragging=hand?'true':'false';
});
stage.addEventListener('pointermove',e=>{
 const point=screenToWorld(e);
 if(!gesture){if(pending)drawGhost(pending.point,point);return;}
 if(gesture.pointer!==e.pointerId)return;
 if(gesture.kind==='pan'){moveCamera({z:gesture.camera.z,x:gesture.camera.x+e.clientX-gesture.mx,y:gesture.camera.y+e.clientY-gesture.my},false);return;}
 if(gesture.kind==='edge'){drawGhost(gesture.start.point,point);return;}
 if(gesture.kind==='frame'){const a=gesture.start,b=point,el=$('#ghost-frame');el.hidden=false;Object.assign(el.style,{left:Math.min(a.x,b.x)+'px',top:Math.min(a.y,b.y)+'px',width:Math.abs(a.x-b.x)+'px',height:Math.abs(a.y-b.y)+'px'});return;}
 if(gesture.kind==='move'&&Math.hypot(e.clientX-gesture.mx,e.clientY-gesture.my)>3){
  if(!gesture.moved){remember(gesture.before);gesture.moved=true;stage.dataset.dragging='true';}
  const item=find(gesture.sel),original=gesture.before[gesture.sel.type==='note'?'notes':'frames'].find(n=>n.id===item.id),dx=point.x-gesture.start.x,dy=point.y-gesture.start.y;item.x=original.x+dx;item.y=original.y+dy;item.pinned=true;
  if(gesture.sel.type==='frame')data.notes.forEach(n=>{if(n.frame===item.id){const old=gesture.before.notes.find(o=>o.id===n.id);n.x=old.x+dx;n.y=old.y+dy;n.pinned=true;}});
  render();
 }
});
stage.addEventListener('pointerup',e=>{
 if(!gesture||gesture.pointer!==e.pointerId)return;const g=gesture,p=screenToWorld(e);gesture=null;stage.dataset.dragging='false';
 if(g.kind==='edge'){const targetEl=document.elementFromPoint(e.clientX,e.clientY),hit=targetEl?eventObject(targetEl):null;if(Math.hypot(e.clientX-g.mx,e.clientY-g.my)<5){pending=g.start;$('#hint').textContent='Jetzt das Ziel wählen';}else{addEdge(g.start,{point:p,id:hit?.type==='note'?hit.id:null});}$('#ghost-line').hidden=true;}
 if(g.kind==='frame'){const r={x:Math.min(g.start.x,p.x),y:Math.min(g.start.y,p.y),w:Math.abs(p.x-g.start.x),h:Math.abs(p.y-g.start.y)};$('#ghost-frame').hidden=true;if(r.w>100&&r.h>80){remember();const id='f'+(++seq);data.frames.push({...r,id,title:'Neuer Bereich',pinned:true});data.notes.forEach(n=>{const c=center(n);if(c.x>r.x&&c.x<r.x+r.w&&c.y>r.y&&c.y<r.y+r.h)n.frame=id;});setTool('select');selection={type:'frame',id};render();openReader('edit');}}
});
stage.addEventListener('pointercancel',()=>{gesture=null;stage.dataset.dragging='false';$('#ghost-frame').hidden=true;$('#ghost-line').hidden=true;});
stage.addEventListener('dblclick',e=>{if(e.target.closest('[data-ui]')||tool!=='select')return;const hit=eventObject(e.target);if(hit?.type==='note'){select(hit);openReader('edit');}else if(hit?.type==='frame')goArea(hit.id);});
stage.addEventListener('wheel',e=>{
 if(e.target.closest('[data-ui]')||e.target.closest('.reader'))return;e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?stage.clientHeight:1,dx=Math.max(-80,Math.min(80,e.deltaX*unit)),dy=Math.max(-80,Math.min(80,e.deltaY*unit));const rect=stage.getBoundingClientRect();
 if(e.ctrlKey){const raw=Math.max(-40,Math.min(40,e.deltaY*unit));zoomBy(Math.exp(-raw*.0015),e.clientX-rect.left,e.clientY-rect.top);}
 else{const ax=e.shiftKey&&!dx?dy:dx,ay=e.shiftKey&&!dx?0:dy;moveCamera({...target,x:Math.max(camera.x-120,Math.min(camera.x+120,target.x-ax*.65)),y:Math.max(camera.y-120,Math.min(camera.y+120,target.y-ay*.65))});}
},{passive:false});
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b){setTool(b.dataset.tool);stage.focus({preventScroll:true});}});
$('#undo').addEventListener('click',undo);$('#redo').addEventListener('click',redo);
$('#context').addEventListener('click',e=>{const a=e.target.closest('[data-context]')?.dataset.context;if(a==='open')openReader();if(a==='edit')openReader('edit');if(a==='copy')void copySelected();if(a==='delete')deleteSelected();});
$('#reader-close').addEventListener('click',()=>closeReader());$('#reader-save').addEventListener('click',()=>{closeReader();toast('Gespeichert');});$('#reader-edit').addEventListener('click',()=>openReader('edit'));$('#reader-copy').addEventListener('click',()=>void copySelected());
$('#area-trigger').addEventListener('click',()=>{const show=$('#area-menu').hidden;$('#area-menu').hidden=!show;$('#area-trigger').setAttribute('aria-expanded',String(show));});
$('#area-menu').addEventListener('click',e=>{const id=e.target.closest('[data-area]')?.dataset.area;if(id)goArea(id);});
$('#zoom-in').addEventListener('click',()=>zoomBy(1.15));$('#zoom-out').addEventListener('click',()=>zoomBy(1/1.15));$('#fit').addEventListener('click',()=>goArea('all'));
root.addEventListener('keydown',e=>{
 const typing=e.target.matches('input,textarea,[contenteditable=true]');
 if(typing){if(e.key==='Escape'){e.preventDefault();closeReader(false);}if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();closeReader();}return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
 if(e.key==='Escape'){closeReader();setTool('select');select(null);$('#area-menu').hidden=true;}
 if(e.code==='Space'){e.preventDefault();space=true;stage.dataset.tool='hand';}
 const map={v:'select',h:'hand',n:'note',t:'text',l:'line',a:'arrow',f:'frame'};if(!e.metaKey&&!e.ctrlKey&&!e.altKey&&map[e.key.toLowerCase()]){setTool(map[e.key.toLowerCase()]);e.preventDefault();}
 if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();}
 if(e.key==='Enter'&&e.target.dataset.node){select({type:'note',id:e.target.dataset.node});openReader();}
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;stage.dataset.tool=tool;}});
window.addEventListener('blur',()=>{space=false;stage.dataset.tool=tool;});
let initialized=false,lastWidth=0;new ResizeObserver(()=>{const width=stage.clientWidth;if(!initialized){initialized=true;goArea('f1',false);}else if(Math.abs(lastWidth-width)>1){moveCamera({...camera,x:camera.x+(width-lastWidth)/2},false);}lastWidth=width;}).observe(stage);
icons();render();
window.paplyBoardDemo={state:()=>({data:snapshot(),selection,tool,camera:{...camera},target:{...target},history:history.length,readerMode}),goArea,setTool,select,openReader,undo,redo};
})();
</script></body></html>
