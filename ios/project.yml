# XcodeGen-Spezifikation für Paply iOS.
# Neu erzeugen:  xcodegen generate --spec ios/project.yml
# Das erzeugte Paply.xcodeproj liegt im Repo, damit ohne XcodeGen gebaut werden kann.
name: Paply

options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: de
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO

settingGroups:
  iphone:
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: Apple Development
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  PaplyKit:
    path: PaplyKit

targets:
  Paply:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: PaplyKeyboard
      - target: PaplyWidgets
      - package: PaplyKit
        product: PaplyKit
    settings:
      groups: [iphone]
      base:
        PRODUCT_NAME: Paply
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPLY_BUNDLE_PREFIX)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Paply.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PAPLY_APP

  PaplyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared/Core
    settings:
      groups: [iphone]
      base:
        PRODUCT_NAME: PaplyKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPLY_BUNDLE_PREFIX).keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/PaplyKeyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PAPLY_KEYBOARD

  PaplyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/Core
      - path: Shared/UI
      - path: Shared/Intents
    settings:
      groups: [iphone]
      base:
        PRODUCT_NAME: PaplyWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(PAPLY_BUNDLE_PREFIX).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/PaplyWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PAPLY_WIDGETS

schemes:
  Paply:
    build:
      targets:
        Paply: all
    run:
      config: Debug
    archive:
      config: Release
