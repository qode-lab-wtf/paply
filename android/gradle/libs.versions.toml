[versions]
agp = "9.5.0"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
core = "1.17.0"
okhttp = "4.12.0"
coroutines = "1.10.2"
json = "1.8.1"
junit = "4.13.2"
activity-compose = "1.11.0"
lifecycle-compose = "2.9.4"
datastore = "1.1.7"
[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "json" }
junit = { module = "junit:junit", version.ref = "junit" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-compose" }
datastore = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
